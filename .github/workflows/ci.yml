name: CI

# Runs the quality gates on every push to main and every pull request so
# regressions are caught before they reach a device.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier (format check)
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      # Advisory: flags dependency/config issues. Non-blocking so an upstream
      # version warning never fails the whole pipeline.
      - name: Expo Doctor
        run: npx expo-doctor
        continue-on-error: true
